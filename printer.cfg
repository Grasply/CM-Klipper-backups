# cr-10 max consolidated configuration
# motherboard: creality v2.4 (atmega2560)
# hotend: phaetus dragonfly

;[include fluidd.cfg]
;[include timelapse.cfg]

;[include KAMP/Configuration/KAMP_Settings.cfg]

[exclude_object]

[respond]

[virtual_sdcard]
path: /home/grasply/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A10K205E-if00-port0
baud: 250000
restart_method: arduino

[mcu rpi]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4500
max_z_velocity: 40
max_z_accel: 500

[gcode_arcs]
resolution: 0.1

[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 66.6
#shaper_type_y: ei
#shaper_freq_y: 29.4

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 470
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 470
homing_speed: 50

#[filament_switch_sensor e0_sensor]
#pause_on_runout: True
#switch_pin: ^ar3

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 470
position_min: -5
homing_speed: 10
# The first touch speed.
second_homing_speed: 3
# Keep this low for maximum precision of the Z zero point.

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 22.400
nozzle_diameter: 0.800
filament_diameter: 1.750
heater_pin: PB4
sensor_type: Generic 3950
sensor_pin: PK5
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5.0
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 50
max_extrude_only_accel: 3000
pressure_advance: 0.42
#control: pid
#pid_kp: 23.664
#pid_ki: 1.242
#pid_kd: 112.701

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
min_temp: 0
max_temp: 120
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182

[gcode_macro M600]
gcode:
    {% set X = params.X|default(5) |float %}
    {% set Y = params.Y|default(5) |float %}
    {% set Z = params.Z|default(50)|float %} # Increased to 50mm for better access
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    # This retracts the filament out of the Dragonfly
    G1 E-50 F1000 
    RESTORE_GCODE_STATE NAME=M600_state


[firmware_retraction]
# Default values are placeholders; macro overrides these on start
retract_length: 4.0
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 45

[filament_switch_sensor e0_sensor]
switch_pin: ^PE4 # The ^ adds a pull-up resistor which is usually needed
pause_on_runout: True
runout_gcode:
  M600

[fan]
pin: PH4

[heater_fan nozzle_fan]
pin: PH3
heater: extruder
heater_temp: 50.0

[bltouch]
sensor_pin: ^PD2
control_pin: PB5
x_offset: -29.0
y_offset: -4.0
# New settings to stop "Move out of range" and "Tolerance" errors:
speed: 5
lift_speed: 40
samples: 3
samples_result: median
sample_retract_dist: 5.0
samples_tolerance: 0.1
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 225, 225
speed: 80
z_hop: 10
z_hop_speed: 5

[bed_screws]
screw1: 60, 60
screw1_name: front left
screw2: 390, 60
screw2_name: front right
screw3: 390, 390
screw3_name: rear right
screw4: 60, 390
screw4_name: rear left

[screws_tilt_adjust]
# Front Left
screw1: 69, 44
screw1_name: front left screw
# Rear Left
screw2: 69, 434
screw2_name: rear left screw
# Front Right
screw3: 459, 44
screw3_name: front right screw
# Rear Right
screw4: 459, 434
screw4_name: rear right screw
horizontal_move_z: 10
speed: 180
screw_thread: CW-M4


[bed_mesh]
speed: 250
horizontal_move_z: 7
mesh_min: 30, 30
mesh_max: 441, 460 # Updated to utilise more of the 470mm bed
probe_count: 9, 9
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 40
split_delta_z: .025
mesh_pps: 2, 2
adaptive_margin: 5 # Native Klipper adaptive margin

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    235, 235, 20

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[gcode_shell_command github_backup]
command: /home/grasply/printer_data/config/autocommit.sh
timeout: 30.0
verbose: True

# --- MACROS ---

[gcode_macro _USER_VARS]
description: Storage for nozzle specific constants across the fleet

# Active nozzle tracking
variable_active_nozzle: 0.4

# 0.2mm Nozzle Constants
variable_retract_length_02: 3.5
variable_retract_speed_02: 50
variable_unretract_speed_02: 40
variable_purge_vol_02: 5

# 0.4mm Nozzle Constants
variable_retract_length_04: 0.8
variable_retract_speed_04: 40
variable_unretract_speed_04: 35
variable_purge_vol_04: 10

# 0.6mm Nozzle Constants
variable_retract_length_06: 6.5
variable_retract_speed_06: 45
variable_unretract_speed_06: 40
variable_purge_vol_06: 15

# 0.8mm Nozzle Constants
variable_retract_length_08: 7.0
variable_retract_speed_08: 40
variable_unretract_speed_08: 35
variable_purge_vol_08: 20

gcode:
  # This section remains empty as it only stores data

[gcode_macro SET_NOZZLE_VARS]
description: Set variables for different nozzle sizes. Options: 0.2, 0.4, 0.6, 0.8
gcode:
  {% set size = params.SIZE|default(0.4)|float %}
  {% set vars = printer["gcode_macro _USER_VARS"] %}
  
  # Update the active nozzle variable for reference in print start logic
  SET_GCODE_VARIABLE MACRO=_USER_VARS VARIABLE=active_nozzle VALUE={size}
  
  {% if size == 0.2 %}
    # High precision settings for O Gauge planks
    SET_PRESSURE_ADVANCE ADVANCE=0.24
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=2.0
    SET_RETRACTION RETRACT_LENGTH={vars.retract_length_02} RETRACT_SPEED={vars.retract_speed_02} UNRETRACT_SPEED={vars.unretract_speed_02}
    
  {% elif size == 0.4 %}
    # Standard general purpose settings
    SET_PRESSURE_ADVANCE ADVANCE=0.05
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5.0
    SET_RETRACTION RETRACT_LENGTH={vars.retract_length_04} RETRACT_SPEED={vars.retract_speed_04} UNRETRACT_SPEED={vars.unretract_speed_04}
    
  {% elif size == 0.6 %}
    # Larger nozzle for structural parts
    SET_PRESSURE_ADVANCE ADVANCE=0.08
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5.0
    SET_RETRACTION RETRACT_LENGTH={vars.retract_length_06} RETRACT_SPEED={vars.retract_speed_06} UNRETRACT_SPEED={vars.unretract_speed_06}
    
  {% elif size == 0.8 %}
    # Rapid prototyping or large scale infill
    SET_PRESSURE_ADVANCE ADVANCE=0.05
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=6.0
    SET_RETRACTION RETRACT_LENGTH={vars.retract_length_08} RETRACT_SPEED={vars.retract_speed_08} UNRETRACT_SPEED={vars.unretract_speed_08}
  {% endif %}

  M117 Nozzle set to {size}mm

[gcode_macro CHECK_NOZZLE]
description: Reports the current active nozzle size to the console
gcode:
    {% set nozzle = printer["gcode_macro _USER_VARS"].active_nozzle %}
    { action_respond_info("The active nozzle is currently set to: " ~ nozzle ~ "mm") }

[gcode_macro PRINT_START]
gcode:
    # 1. Parameter Initialization
    # These grab the temperatures and nozzle size directly from the g-code file.
    {% set bed_temp = params.BED|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER|default(200)|float %}
    {% set nozzle_size = params.NOZZLE|default(0.4)|float %}
    
    # Get the physical nozzle size defined in the [extruder] section of printer.cfg
    {% set physical_nozzle = printer.configfile.settings.extruder.nozzle_diameter|float %}

    # 2. Hardware Safety Check
    # This prevents printing if the sliced file does not match the fitted hardware.
    {% if nozzle_size != physical_nozzle %}
        {action_raise_error("Nozzle Mismatch! Slicer: " ~ nozzle_size ~ "mm vs Printer: " ~ physical_nozzle ~ "mm. Update printer.cfg and restart.")}
    {% endif %}

    # 3. Variable and Mode Setup
    {% set vars = printer["gcode_macro _USER_VARS"] %}
    M104 S0                           ; Clear existing nozzle heat
    M140 S0                           ; Clear existing bed heat
    BED_MESH_CLEAR                    ; Clear old mesh data
    G90                               ; Use absolute coordinates
    M83                               ; Extruder relative mode

    # 4. Pre-heat and Home
    M117 Pre-heating...
    M140 S{bed_temp}                  ; Start heating bed
    M104 S150                         ; Set nozzle to standby (prevent ooze)
    G28                               ; Home all axes

    # 5. Apply Nozzle Specific Variables
    # This automatically sets PA, SCV, and Retraction based on the slicer input.
    SET_NOZZLE_VARS SIZE={nozzle_size}

    # 6. Thermal Soak and Mesh
    M117 Heating Bed...
    M190 S{bed_temp}                  ; Wait for bed to reach temperature
    M117 Adaptive Meshing...
    BED_MESH_CALIBRATE ADAPTIVE=1     ; Probe only the required area

    # 7. Final Heat and Position
    G1 X2 Y20 Z10 F15000              ; Move to purge start position
    M117 Final Heating...
    M109 S{extruder_temp}             ; Wait for final printing temperature

    # 8. Purge Logic
    # Selects the correct volume for the purge line from _USER_VARS.
    {% if nozzle_size == 0.8 %}{% set purge_vol = vars.purge_vol_08 %}
    {% elif nozzle_size == 0.6 %}{% set purge_vol = vars.purge_vol_06 %}
    {% elif nozzle_size == 0.2 %}{% set purge_vol = vars.purge_vol_02 %}
    {% else %}{% set purge_vol = vars.purge_vol_04 %}{% endif %}

    M117 Purging...
    G1 Z0.3 F240
    G92 E0 
    G1 Y140 E{purge_vol} F1500        ; Extrude first leg
    G1 X2.4 F5000 
    G1 Y20 E{purge_vol} F1200         ; Extrude second leg
    G92 E0
    
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    ; Define height variables for the calculation
    {% set act_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    ; Calculate a 20mm lift while ensuring we do not exceed the hardware ceiling
    {% set target_z = [act_z + 20, max_z]|min %}

    M117 Finishing print...
    G90 ; Use absolute coordinates
    G1 Z{target_z} F600 ; Lift nozzle 20mm above the finished print
    G1 X5 Y376 F3000 ; Present the bed at 80 percent depth at a safe speed

    ; Shut down heaters, fans, and motors
    M140 S0 ; Turn off bed
    M104 S0 ; Turn off nozzle
    M107 ; Turn off fan
    M84 X Y E ; Disable motors
    M117 Print Finished

[gcode_macro START_PRINT]
description: Alias for PRINT_START
gcode:
    PRINT_START {rawparams}

[gcode_macro END_PRINT]
description: Alias for PRINT_END
gcode:
    PRINT_END {rawparams}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M107
  G91
  G1 Z10 F3000
  G90
  G1 X0 Y450 F3000
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  G91
  G1 E-2 F2700
  G1 Z10 F600
  G90
  G1 X10 Y450 F3000

[gcode_macro RESUME]
description: Resume with automatic heating and nozzle purge
rename_existing: RESUME_BASE
gcode:
    # Variables for the 0.8mm nozzle
    {% set purge = params.PURGE|default(25)|float %}
    {% set target_temp = params.TEMP|default(215)|float %}
    
    # 1. Heat the hotend if it has cooled down
    {% if printer.extruder.temperature < 180 %}
        M117 Heating to {target_temp}C...
        M109 S{target_temp}
    {% endif %}

    # 2. Perform the purge at X=5, Y=5
    M117 Purging {purge}mm...
    G91
    G1 E{purge} F300
    G4 P2000 # Wait for pressure
    
    # 3. The Front-Left Flick
    G1 X15 Y15 F6000
    G1 X-15 Y-15 F6000
    G90
    
    # 4. Return to the print
    M117 Resuming...
    # We use a generic state restore to avoid the M600 error
    RESTORE_GCODE_STATE NAME=M600_state MOVE=1 MOVE_SPEED=100
    RESUME_BASE
    
[gcode_macro Z_OFFSET_PAPER]
description: Preheats, homes, and centres the PROBE for calibration.
gcode:
    {% set x_center = 235 %}
    {% set y_center = 235 %}
    {% set x_offset = printer.configfile.settings.bltouch.x_offset|float %}
    {% set y_offset = printer.configfile.settings.bltouch.y_offset|float %}

    M117 Preheating...
    M140 S60                # Set bed to 60C
    M104 S150               # Set nozzle to 150C
    M190 S60                # Wait for bed
    M109 S150               # Wait for nozzle
    
    M117 Homing...
    BED_MESH_CLEAR          
    G28
    
    M117 Centring Probe...
    G90                     # Absolute positioning
    # Move so the PROBE is at the center of the bed
    G1 X{x_center - x_offset} Y{y_center - y_offset} Z10 F3000 
    
    M117 Starting calibrate...
    PROBE_CALIBRATE

[gcode_macro Z_OFFSET_APPLY]
description: Applies the current Z-offset adjustment to the probe and saves to config.
gcode:
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG


[gcode_macro CHECK_BED_TILT]
description: Heats bed to 60C, homes, and runs SCREWS_TILT_CALCULATE.
gcode:
    M117 Heating bed...
    M140 S60                # Set bed to 60C
    M190 S60                # Wait for bed
    M117 Homing...
    G28
    M117 Calculating tilt...
    SCREWS_TILT_CALCULATE

[gcode_macro CREATE_BED_MESH]
description: Heats bed to 60C, homes, probes, and saves
gcode:
    M140 S60
    M190 S60
    G28
    M117 Saving mesh...
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG

[gcode_macro RUN_GITHUB_BACKUP]
gcode:
    RUN_SHELL_COMMAND CMD=github_backup

[gcode_macro G29]
description: Heat bed, home all axes and run a full bed mesh
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M117 Heating bed to {BED_TEMP}C
    M140 S{BED_TEMP}       # Set bed temperature
    M190 S{BED_TEMP}       # Wait for bed to reach temperature
    G28                    # Home all axes
    BED_MESH_CALIBRATE     # Start the probing sequence
    SAVE_CONFIG

[gcode_macro LOAD_SAVED_MESH]
description: Clears current state and loads the default bed mesh
gcode:
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD=default
    {action_respond_info("Bed mesh 'default' loaded")}

[gcode_macro SAFE_SHUTDOWN]
description: Halts the Raspberry Pi
gcode:
    M400
    BED_MESH_CLEAR
    M117 System Halting
    {action_call_remote_method("shutdown_machine")}

